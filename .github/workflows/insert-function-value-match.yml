name: Insert function-value coefficient match
on:
  push:
    paths:
      - '.github/workflows/insert-function-value-match.yml'
permissions:
  contents: write
jobs:
  edit-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.tex
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('main.tex')
          text=p.read_text()
          marker='Next, we match the coefficients of the function-value terms in $F$.'
          insert=base64.b64decode('').decode()
          assert text.count(marker)==1, text.count(marker)
          p.write_text(text.replace(marker, marker+'\n'+insert, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex
          git commit -m 'Add function-value coefficient matching'
          git push
