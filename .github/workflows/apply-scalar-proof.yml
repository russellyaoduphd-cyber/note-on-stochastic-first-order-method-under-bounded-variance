name: Apply scalar multiplier proof
on:
  push:
    paths:
      - '.github/workflows/apply-scalar-proof.yml'
permissions:
  contents: write
jobs:
  edit-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.tex
        shell: python
        run: |
          from pathlib import Path
          import base64
          p = Path('main.tex')
          text = p.read_text()
          old = base64.b64decode('XHN1YnNlY3Rpb257VmVyaWZ5IE11bHRpcGxpZXJzIGFyZSBub24tbmVnYXRpdmUgYW5kIFByb3ZlIFBvc2l0aXZlIFNlbWlkZWZpbml0ZW5lc3N9ClxzdWJzZWN0aW9ue0NvZWZmaWNpZW50cyBNYXRjaH0=').decode()
          new = base64.b64decode('').decode()
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new, 1))
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex
          git commit -m 'Add concise proof of scalar multiplier nonnegativity'
          git push
