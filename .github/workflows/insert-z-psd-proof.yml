name: Insert Z PSD proof
on:
  push:
    paths:
      - '.github/workflows/insert-z-psd-proof.yml'
permissions:
  contents: write
jobs:
  edit-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.tex
        run: |
          python -c "from pathlib import Path; import base64; p=Path('main.tex'); t=p.read_text(); m='\\\\subsection{Coefficients Match}'; ins=base64.b64decode('').decode(); assert t.count(m)==1, t.count(m); p.write_text(t.replace(m, ins+'\\n'+m, 1))"
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex
          git commit -m 'Add proof that Z is positive semidefinite'
          git push