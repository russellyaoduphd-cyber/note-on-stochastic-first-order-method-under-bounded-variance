name: Insert Z PSD proof
on:
  push:
    paths:
      - '.github/workflows/insert-z-psd-proof.yml'
permissions:
  contents: write
jobs:
  edit-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.tex
        run: |
          python -c "from pathlib import Path; import base64; p=Path('main.tex'); t=p.read_text(); s=base64.b64decode('XGJlZ2lue3Byb3Bvc2l0aW9ufQpUaGUgR3JhbSBtdWx0aXBsaWVyICRaJCBpcyBwb3NpdGl2ZSBzZW1pZGVmaW5pdGUu').decode(); e=base64.b64decode('XHN1YnNlY3Rpb257Q29lZmZpY2llbnRzIE1hdGNofQ==').decode(); ins=base64.b64decode('').decode(); i=t.index(s); j=t.index(e,i); p.write_text(t[:i]+ins+'\\n'+t[j:])"
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.tex
          git commit -m 'Fix proof that Z is positive semidefinite'
          git push